[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "gridpilot"
version = "0.1.0"
description = "Energy intelligence engine for commercial and industrial facilities."
readme = "README.md"
requires-python = ">=3.11"
license = { text = "Apache-2.0" }

authors = [
    { name = "Vaibhav Venu" }
]

dependencies = [
    "pydantic>=2.7,<3.0",
    "pypdf>=5.0,<7.0",
]

[project.scripts]
gridpilot = "gridpilot.cli:main"

[project.optional-dependencies]
dev = [
    "pytest>=8.0",
    "ruff>=0.5",
    "reportlab>=4.0,<5.0",
]

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
pythonpath = ["src"]
testpaths = ["tests"]

[tool.ruff]
line-length = 100
target-version = "py311"
